<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>顯化宇宙・自我心靈小天地</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --gold-primary: #f59e0b;
            --gold-gradient: linear-gradient(135deg, #fef08a 0%, #f59e0b 50%, #b45309 100%);
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(245, 158, 11, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(245, 158, 11, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(59, 130, 246, 0.08) 0%, transparent 40%);
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            animation: fadeIn 1s ease-in-out;
        }

        h1 {
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 2.2rem;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 1rem;
        }

        .container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease;
        }

        .card:hover {
            border-color: rgba(245, 158, 11, 0.6);
        }

        h2 {
            font-size: 1.3rem;
            color: var(--gold-primary);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* 支票產生器樣式 */
        .cheque {
            background: linear-gradient(135deg, #fffbeb 0%, #fef3c7 100%);
            color: #1e293b;
            border-radius: 12px;
            padding: 20px;
            border: 2px dashed #d97706;
            position: relative;
        }

        .cheque-header {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            margin-bottom: 15px;
            color: #b45309;
        }

        .form-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            color: #64748b;
            margin-bottom: 4px;
        }

        input, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, textarea:focus {
            border-color: #f59e0b;
            box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.15);
        }

        .btn {
            background: var(--gold-gradient);
            color: #fff;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            padding: 12px 20px;
            width: 100%;
            cursor: pointer;
            font-size: 1rem;
            transition: opacity 0.2s, transform 0.1s;
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3);
        }

        .btn:hover {
            opacity: 0.9;
        }

        .btn:active {
            transform: scale(0.98);
        }

        /* 呼吸冥想器 */
        .breath-display {
            text-align: center;
            padding: 30px 0;
        }

        .circle-animation {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: rgba(245, 158, 11, 0.2);
            border: 2px solid var(--gold-primary);
            margin: 0 auto 20px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 4s ease-in-out;
        }

        .inhale {
            transform: scale(1.4);
            background: rgba(245, 158, 11, 0.4);
        }

        /* 感恩日誌 */
        .gratitude-list {
            list-style: none;
            margin-top: 10px;
        }

        .gratitude-item {
            background: rgba(15, 23, 42, 0.5);
            padding: 10px 14px;
            border-radius: 8px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 3px solid var(--gold-primary);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <header>
        <h1>✨ 顯化宇宙・自我心靈小天地 ✨</h1>
        <p class="subtitle">釋放情緒、對齊頻率，向宇宙下訂你的豐盛支票</p>
    </header>

    <div class="container">
        
        <!-- 顯化支票區 -->
        <div class="card">
            <h2>💛 宇宙顯化支票</h2>
            <div class="cheque">
                <div class="cheque-header">
                    <span>UNIVERSE BANK OF ABUNDANCE</span>
                    <span>No. 888888</span>
                </div>
                <div class="form-group">
                    <label>付給 (Pay to the order of):</label>
                    <input type="text" id="payee" value="親愛的自己">
                </div>
                <div class="form-group">
                    <label>金額 (Amount):</label>
                    <input type="text" id="amount" value="NT$ 88,888,000">
                </div>
                <div class="form-group">
                    <label>顯化意圖與用途 (For):</label>
                    <input type="text" id="purpose" value="財務自由、身心平衡與全然的豐盛與平靜">
                </div>
            </div>
            <br>
            <button class="btn" onclick="alert('✨ 您的顯化意圖已成功傳送至宇宙，請保持信念與覺察！')">送出至宇宙顯化 🌟</button>
        </div>

        <!-- 呼吸冥想調節區 -->
        <div class="card">
            <h2>🧘‍♀️ 呼吸正念小天地</h2>
            <div class="breath-display">
                <div id="breathCircle" class="circle-animation">
                    <span id="breathText" style="font-weight: bold; color: var(--gold-primary);">準備開始</span>
                </div>
                <button class="btn" onclick="toggleBreath()" id="breathBtn">開始 4 秒呼吸引導</button>
            </div>
        </div>

        <!-- 感恩小卡區 -->
        <div class="card">
            <h2>🌸 今日感恩</h2>
            <div class="form-group">
                <input type="text" id="gratitudeInput" placeholder="寫下一件今天值得感謝的事...">
            </div>
            <button class="btn" onclick="addGratitude()" style="margin-bottom: 15px;">新增感恩紀錄</button>
            <ul id="gratitudeList" class="gratitude-list">
                <li class="gratitude-item">感謝今天順利突破盲點 ✨</li>
            </ul>
        </div>

    </div>

    <script>
        // 呼吸冥想互動邏輯
        let breathInterval;
        let isBreathing = false;

        function toggleBreath() {
            const circle = document.getElementById('breathCircle');
            const text = document.getElementById('breathText');
            const btn = document.getElementById('breathBtn');

            if (isBreathing) {
                clearInterval(breathInterval);
                circle.classList.remove('inhale');
                text.innerText = "準備開始";
                btn.innerText = "開始 4 秒呼吸引導";
                isBreathing = false;
                return;
            }

            isBreathing = true;
            btn.innerText = "停止冥想";
            
            let phase = 0; // 0: 吸氣, 1: 吐氣
            runBreathCycle();
            breathInterval = setInterval(runBreathCycle, 4000);

            function runBreathCycle() {
                if (phase === 0) {
                    circle.classList.add('inhale');
                    text.innerText = "吸氣...";
                    phase = 1;
                } else {
                    circle.classList.remove('inhale');
                    text.innerText = "吐氣...";
                    phase = 0;
                }
            }
        }

        // 感恩日誌互動邏輯
        function addGratitude() {
            const input = document.getElementById('gratitudeInput');
            const val = input.value.trim();
            if (!val) return;

            const list = document.getElementById('gratitudeList');
            const li = document.createElement('li');
            li.className = 'gratitude-item';
            li.innerHTML = `${val} 💖`;
            
            list.prepend(li);
            input.value = '';
        }
    </script>
</body>
</html>
